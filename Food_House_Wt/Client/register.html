<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food House - Create Account</title>
    <!-- Root style.css Link -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Food House</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="auth-container">
        <h2>Create Account</h2>
        <form id="regForm" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="reg_name" class="form-control" placeholder="Full Name">
                <span class="error-msg" id="err_name"></span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg_email" class="form-control" placeholder="name@example.com">
                <span class="error-msg" id="err_email"></span>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="reg_mobile" class="form-control" placeholder="10 Digit Number">
                <span class="error-msg" id="err_mobile"></span>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg_pass" class="form-control" placeholder="Min 6 characters">
                <span class="error-msg" id="err_pass"></span>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="reg_cpass" class="form-control" placeholder="Re-enter password">
                <span class="error-msg" id="err_cpass"></span>
            </div>

            <button type="submit" class="btn" style="width:100%; margin-top:10px;">Register</button>
            <p style="text-align:center; margin-top:15px; font-size:14px;">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </form>
    </div>

    <footer>
        <p>Food House</p>
    </footer>

    <!-- Root script.js -->
    <script src="../script.js"></script>

    <!-- Inline Dedicated Registration Handler -->
    <script>
        function handleRegistration(e) {
            // Page refresh thatu atkvavo
            e.preventDefault();

            // Clear previous errors
            document.querySelectorAll('.error-msg').forEach(el => el.innerText = '');

            const name = document.getElementById('reg_name').value.trim();
            const email = document.getElementById('reg_email').value.trim();
            const mobile = document.getElementById('reg_mobile').value.trim();
            const pass = document.getElementById('reg_pass').value;
            const cpass = document.getElementById('reg_cpass').value;

            let valid = true;

            // 1. Name Check
            if (!name) {
                document.getElementById('err_name').innerText = 'Name is required.';
                valid = false;
            }

            // 2. Email Check
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('err_email').innerText = 'Please enter a valid email address.';
                valid = false;
            }

            // 3. Mobile Check (Exact 10 digits)
            if (!/^\d{10}$/.test(mobile)) {
                document.getElementById('err_mobile').innerText = 'Enter a valid 10-digit mobile number.';
                valid = false;
            }

            // 4. Password Length Check
            if (pass.length < 6) {
                document.getElementById('err_pass').innerText = 'Password must be at least 6 characters.';
                valid = false;
            }

            // 5. Password Match Check
            if (pass !== cpass) {
                document.getElementById('err_cpass').innerText = 'Passwords do not match.';
                valid = false;
            }

            // If all validations pass
            if (valid) {
                const users = JSON.parse(localStorage.getItem('fh_users') || '[]');
                
                // Add new customer
                users.push({
                    name: name,
                    email: email,
                    mobile: mobile,
                    password: pass
                });

                // Save to LocalStorage
                localStorage.setItem('fh_users', JSON.stringify(users));

                alert('Account created successfully! Redirecting to Login...');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
