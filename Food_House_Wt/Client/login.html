<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food House - Login</title>
    <!-- Root style.css Link -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Food House</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <div class="auth-container">
        <h2>Login</h2>
        <form onsubmit="handleClientLogin(event)">
            <div class="form-group">
                <label>Email or Mobile Number</label>
                <input type="text" id="login_id" class="form-control" placeholder="Enter Email or Phone">
                <span class="error-msg" id="err_login_id" style="color:red; font-size:12px; margin-top:5px; display:block;"></span>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login_pass" class="form-control" placeholder="Password">
                <span class="error-msg" id="err_login_pass" style="color:red; font-size:12px; margin-top:5px; display:block;"></span>
            </div>
            
            <button type="submit" class="btn" style="width:100%; margin-top:10px;">Login</button>
            
            <p style="text-align:center; margin-top:15px; font-size:14px;">
                Don't have an account? <a href="register.html">Register</a>
            </p>
        </form>
    </div>

    <footer>
        <p>Food House</p>
    </footer>

    <!-- Root script.js -->
    <script src="../script.js"></script>

    <!-- Dedicated Inline Login Handler -->
    <script>
        function handleClientLogin(e) {
            // Prevent page refresh
            e.preventDefault();

            // Clear previous errors
            document.getElementById('err_login_id').innerText = '';
            document.getElementById('err_login_pass').innerText = '';

            const identity = document.getElementById('login_id').value.trim();
            const pass = document.getElementById('login_pass').value;

            let valid = true;

            if (!identity) {
                document.getElementById('err_login_id').innerText = 'Email or mobile number is required.';
                valid = false;
            }
            if (!pass) {
                document.getElementById('err_login_pass').innerText = 'Password is required.';
                valid = false;
            }

            if (!valid) return;

            // Fetch registered users from LocalStorage
            const users = JSON.parse(localStorage.getItem('fh_users') || '[]');

            // Check if user exists
            const user = users.find(u => (u.email === identity || u.mobile === identity) && u.password === pass);

            if (user) {
                // Save active session
                localStorage.setItem('fh_current_user', JSON.stringify(user));
                alert('Welcome back, ' + user.name + '! Login successful.');
                // Redirect to Home Page
                window.location.href = 'index.html';
            } else {
                document.getElementById('err_login_id').innerText = 'Invalid email/mobile or password. Please try again.';
            }
        }
    </script>
</body>
</html>
